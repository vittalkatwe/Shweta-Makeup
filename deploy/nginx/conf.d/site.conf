# Production edge config — mounted into the `web` container by
# docker-compose.prod.yml, replacing the plain-HTTP default baked into the
# frontend image. TLS certs come from the host's /etc/letsencrypt (read-only
# mount); renewal stays on the host certbot in webroot mode (see docs/deployment.md).

server {
  listen 80;
  server_name shwetamakeover.online www.shwetamakeover.online;

  # ACME http-01 challenges (host certbot renews with --webroot -w /var/www/certbot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name shwetamakeover.online www.shwetamakeover.online;

  ssl_certificate     /etc/letsencrypt/live/shwetamakeover.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shwetamakeover.online/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Docker's embedded DNS + a variable upstream: nginx starts even when the
    # backend container isn't up yet, and re-resolves if it gets a new IP.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:5001;
    # No trailing slash on proxy_pass — the /api prefix is preserved.
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Backend runs with `trust proxy: 1` — real client IPs come from this header.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Vite emits content-hashed filenames under /assets — cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (/payment, /contact, ...) serve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

# ── Admin dashboard (admin.shwetamakeover.online) → Next.js `admin` container ──
# Admin's browser JS calls the apex domain's /api (cross-origin), so this vhost
# only reverse-proxies the Next.js app — no /api/ block here. The apex backend's
# CORS_ORIGINS must include https://admin.shwetamakeover.online.
server {
  listen 80;
  server_name admin.shwetamakeover.online;

  # ACME http-01 challenges (host certbot renews with --webroot -w /var/www/certbot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.shwetamakeover.online;

  ssl_certificate     /etc/letsencrypt/live/admin.shwetamakeover.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.shwetamakeover.online/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    # Docker's embedded DNS + a variable upstream: nginx starts even when the
    # admin container isn't up yet, and re-resolves if it gets a new IP.
    resolver 127.0.0.11 valid=30s;
    set $admin_upstream http://admin:3000;
    # No URI part on proxy_pass — the full request path is forwarded to Next.js.
    proxy_pass $admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
