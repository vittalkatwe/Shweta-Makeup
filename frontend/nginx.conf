# Plain HTTP config baked into the image — used for local prod-compose testing
# and standalone runs. Production mounts deploy/nginx/conf.d/site.conf (TLS)
# over this file.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    # Docker's embedded DNS + a variable upstream: nginx starts even when the
    # backend container isn't up yet, and re-resolves if it gets a new IP.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:5001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite emits content-hashed filenames under /assets — cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (/payment, /contact, ...) serve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
